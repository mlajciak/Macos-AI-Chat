name: agent-gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install engine
        run: |
          if [ -d vendor/xyzt-core ]; then
            cd vendor/xyzt-core && pnpm install && pnpm build
          else
            echo "vendor/xyzt-core missing — configure submodule for CI"
            exit 1
          fi

      - name: Install agent
        run: pnpm install

      - name: agent:gate
        run: pnpm agent:gate
